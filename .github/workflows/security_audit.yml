name: Security Audit
on:
  pull_request:
    paths:
      - .github/workflows/security_audit.yml
      - '**/Cargo.lock'
  push:
    branches: main
    paths: '**/Cargo.lock'
  schedule:
    - cron: "0 0 * * *"

# The advisory check only reads the tree. It is deliberately not granted
# `issues: write`: filing advisories as issues automatically is a separate
# decision, not a consequence of tightening permissions.
permissions:
  contents: read

jobs:
  security_audit:
    name: Security Audit Workspace
    runs-on: ubuntu-latest
    # Bounded for the same reason as the CI jobs, and more so: this one runs on
    # a nightly schedule, where a hung job is least likely to be noticed
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
