name: CI

on:
  pull_request: {}
  push:
    branches: main

# Read-only is all any job here needs: nothing publishes, comments or writes.
permissions:
  contents: read

# A new push to a pull request branch makes the run already in flight for it
# obsolete, so stop paying for it. Everything else gets a group of its own,
# keyed on the run: sharing one group would make GitHub cancel a run that is
# still queued when the next push arrives, which can leave a commit on `main`
# with no CI result at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-Dwarnings'
  RUSTDOCFLAGS: '-Dwarnings'

# Every job bounds its runtime. The values catch a hung job, which would
# otherwise hold a runner until GitHub's six-hour default; they are not
# performance budgets, so they sit well above the few minutes a leg takes.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: sudo apt-get update && sudo apt-get install libudev-dev
      - run: cargo check --all-features

  build:
    strategy:
      # Report every leg: a cancelled leg is indistinguishable from an untested
      # one, which hides whether a failure is confined to a single toolchain
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0 # MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: sudo apt-get update && sudo apt-get install libudev-dev
      - run: cargo build --no-default-features --features softsign --release
      - run: cargo build --features=yubihsm --release
      - run: cargo build --features=yubihsm-server --release
      - run: cargo build --features=ledger --release
      - run: cargo build --features=yubihsm-server,ledger,softsign --release

  test:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.85.0 # MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: sudo apt-get update && sudo apt-get install libudev-dev
      - run: cargo test --all-features -- --test-threads 1

  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.89 # pinned to prevent breakages when clippy updates
      - run: sudo apt-get update && sudo apt-get install libudev-dev
      - run: rustup component add clippy
      - run: cargo clippy --all-features

  # Licenses, banned crates and dependency sources. Advisories are covered by the
  # separate security_audit workflow.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources
