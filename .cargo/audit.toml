# https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
ignore = [
    "RUSTSEC-2019-0036", # failure: type confusion if __private_get_type_id__ is overridden
    "RUSTSEC-2020-0036", # failure is officially deprecated/unmaintained
    # paste 1.0.15: proc-macro crate is unmaintained; no known vulnerability.
    "RUSTSEC-2024-0436",
    # time 0.3.45 (stack exhaustion parsing format descriptions). The fix landed in 0.3.47,
    # which requires Rust 1.88 and so exceeds this crate's 1.85 MSRV; the resolver holds time
    # back accordingly. Not reachable here: the transitive users (iq-cometbft, yubihsm, sdkms)
    # parse timestamps with fixed, well-known formats rather than untrusted format strings.
    # Revisit when the MSRV moves to 1.88 or later.
    "RUSTSEC-2026-0009",
    # h2 0.3.27 (unbounded queue of empty DATA frames). Reached only through sdkms ->
    # simple-hyper-client -> hyper 0.14 under the `fortanixdsm` feature, which the release
    # image does not build. Even there it never runs: simple-hyper-client neither asks hyper
    # for HTTP/2 nor negotiates it over ALPN, so the Fortanix DSM client speaks HTTP/1.1 only.
    # The fix is h2 0.4.16, which only hyper 1 accepts, and sdkms 0.5.1, its newest release,
    # still uses hyper 0.14, so no update can clear it. Revisit when sdkms moves to hyper 1.
    "RUSTSEC-2026-0258",
    # crypto-bigint 0.5.5 (operations meant to be constant-time can branch on secret data).
    # Reached through elliptic-curve 0.13, which k256, p256, p384 and ecdsa build on, and
    # which this crate, iq-cometbft and yubihsm all use. The only installable fix is 0.7.9 or
    # later, which requires Rust 1.87, above this crate's 1.85 MSRV, and is reachable only
    # from elliptic-curve 0.14. A secp256k1 secret passes through it whenever a k256 signing
    # key is built in-process: softsign keygen, import, loading and signing, parsing a
    # priv_validator key file, and yubihsm key import. Ed25519 consensus keys go through
    # curve25519-dalek, and keys held in a YubiHSM or Ledger never leave the device. Revisit
    # when the MSRV reaches 1.87 and this crate, iq-cometbft and yubihsm have all moved to
    # elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
]
